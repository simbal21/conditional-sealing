# This workflow exists to produce one verifiable green run at release;
# the repository is then archived and the run is frozen.
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # v3-api's tests load the compiled ConditionEngine ABI from
      # contracts/out/, so the contracts must be built before the TS tests.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build
        working-directory: contracts
        env:
          CHAIN_RPC_URL: http://localhost:8545
      - run: pnpm install --frozen-lockfile
      # Build before typecheck: workspace packages resolve each other through
      # their compiled dist/ entry points (package.json "main"/"exports"), so
      # a dependent package cannot typecheck until its dependencies are built.
      # pnpm -r runs both steps in topological order.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      # @cealis/v3-sd and @cealis/v3-demo are excluded from the CI test run:
      # their test suites need the PLONK trusted-setup artifacts (compiled
      # circom circuits + the pinned Hermez powers-of-tau transcript) that are
      # generated by a separate, network-dependent toolchain step — see
      # v3-sd/setup/README.md. To run them locally:
      #   pnpm --filter @cealis/v3-sd run setup:circuits
      #   pnpm --filter @cealis/v3-sd --filter @cealis/v3-demo run test
      - run: pnpm -r --filter '!@cealis/v3-sd' --filter '!@cealis/v3-demo' run test

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # contracts/foundry.toml declares an rpc_endpoints entry that
      # interpolates ${CHAIN_RPC_URL}. No test in this job talks to a live
      # chain; the placeholder only keeps config parsing satisfied.
      CHAIN_RPC_URL: http://localhost:8545
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # contracts/lib/ ships VENDORED copies of forge-std (8b531a0) and
      # openzeppelin-contracts (8b010f9) — the exact revisions the retirement
      # suite ran against, re-verified 330/330 on 2026-07-03 with forge 1.7.1.
      # No forge install step is needed or wanted.
      - run: forge --version
      - run: forge test
