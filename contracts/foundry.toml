[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../v3-crypto/test/fixtures/" },
    { access = "read-write", path = "./deployments/" },
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 32
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${CHAIN_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
